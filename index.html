<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренер 24</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: бодрый тренер в кармане — коротко, тепло, без воды
   IDEA: ночная спортивная раздевалка: графит, неоновый жар коралла, объёмные «игрушечные» иконки
   PICTURE: кольцо дня с жаром-градиентом, 3D-иконки камеры/гантели/огня, большая кнопка «+» в центре
   COLOUR and TYPE: графит #121115, коралл #ff6b2c→#ff3d5a, синий белок, жёлтые жиры, мятные углеводы; Unbounded + Manrope
   LAYOUT: колонка телефона до 440px, шапка, контент карточками, нижний таб-бар с центральной кнопкой */
:root{color-scheme:dark;--bg:#121115;--bg2:#1b1a20;--card:#211f27;--card2:#2a2731;--line:#34303d;--ink:#f6f3ef;--mute:#a39fab;
--acc:#ff6b2c;--acc2:#ff3d5a;--grad:linear-gradient(135deg,#ff8a3d,#ff5a2c 45%,#ff3d5a);
--pro:#5b8cff;--fat:#ffc53d;--carb:#3fe0a6;--glow:0 10px 30px -8px rgba(255,90,44,.55)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom));
 background:radial-gradient(120% 50% at 50% -10%,rgba(255,107,44,.18),transparent 60%)}
h1,.disp{font-family:Unbounded,Manrope,sans-serif;font-weight:800;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;margin:6px 0 16px;text-wrap:balance}
h2{font-size:18px;margin:0;font-weight:800}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.logo{display:flex;align-items:center;gap:8px;font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:800;font-size:15px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-content:center;box-shadow:var(--glow)}
.sp{flex:1}
.coachBtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:0 14px 0 6px;min-height:40px;font-weight:700;font-size:14px}
.coachBtn b{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-content:center;font-size:13px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pro);outline-offset:2px}
.btn{min-height:52px;border-radius:18px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;width:100%;box-shadow:var(--glow)}
.btn.sec{background:var(--card2);box-shadow:none}
.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);padding:5px;border-radius:18px;margin-bottom:14px}
.seg button{min-height:44px;border-radius:14px;font-weight:800;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px;text-align:center}
.week button{display:grid;gap:4px;justify-items:center;padding:4px 0;font-size:11px;color:var(--mute);font-weight:700;min-height:62px}
.week b{width:38px;height:38px;border-radius:50%;display:grid;place-content:center;font-size:15px;color:var(--ink);border:2px solid transparent}
.week .has b{border-color:var(--line)}
.week [aria-pressed=true] b{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.week .fut b{color:#5d5966}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring small{font-size:12px;color:var(--mute);font-weight:700}
.big{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;white-space:nowrap}
.kv{font-size:13px;color:var(--mute);font-weight:700}.kv b{display:block;color:var(--ink);font-size:24px;font-family:Unbounded,Manrope,system-ui,sans-serif;line-height:1.2}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.mac{display:flex;gap:8px;align-items:center}
.mac .lt{width:30px;height:30px;border-radius:10px;display:grid;place-content:center;font-weight:800;font-size:13px;color:#16131a;flex:none}
.mac b{font-size:15px;display:block;line-height:1.1;white-space:nowrap}.mac span{font-size:11px;color:var(--mute)}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.meal{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.meal h2 span{font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--mute);margin-left:6px}
.plus{width:40px;height:40px;border-radius:14px;background:var(--card);color:var(--acc);font-size:24px;line-height:1;display:grid;place-content:center;font-weight:600}
.dish{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:8px;min-height:60px}
.dish .ph{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-content:center;font-size:22px;background:var(--card2);overflow:hidden}
.dish .ph img{width:100%;height:100%;object-fit:cover}
.dish .nm{font-weight:700;line-height:1.25}.dish small{color:var(--mute);font-size:12px}
.num{white-space:nowrap;font-weight:800;text-align:right}
.empty{color:var(--mute);font-weight:600;justify-content:space-between}
.x{color:var(--mute);width:36px;height:36px;border-radius:12px;font-size:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav>div{pointer-events:auto;max-width:416px;margin:0 auto;height:72px;background:rgba(33,31,39,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);min-height:56px;align-content:center}
.nav svg{width:24px;height:24px}
.nav [aria-current=page]{color:var(--ink)}.nav [aria-current=page] svg{color:var(--acc)}
.nav .fab{width:66px;height:66px;border-radius:50%;background:var(--grad);justify-self:center;margin-top:-30px;box-shadow:0 12px 30px -6px rgba(255,80,50,.7),0 0 0 6px var(--bg);color:#fff;font-size:34px;font-weight:500;line-height:1;align-content:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,4,8,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet>div{background:var(--bg2);width:100%;max-width:440px;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(30px);transition:transform .25s}
.sheet.on>div{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}.shead small{color:var(--mute);font-weight:700;font-size:13px}
.shead h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:22px;line-height:1.15}
.close{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--mute);font-size:18px;flex:none}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{position:relative;background:var(--card);border-radius:24px;min-height:150px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.tile svg{position:absolute;top:8px;right:6px;width:84px;height:84px}
.tile b{font-size:16px}.tile small{font-size:12px;color:var(--mute);font-weight:700}.tile small.hot{color:var(--acc)}
.tile.wide{grid-column:1/-1;min-height:96px;background:linear-gradient(135deg,#2d2230,#3a1f22)}
.tile.wide svg{top:50%;transform:translateY(-50%);right:12px;width:76px;height:76px}
.ex{background:var(--card);border-radius:22px;padding:14px;margin-bottom:10px}
.ex h3{margin:0;font-size:16px;line-height:1.25}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,107,44,.14);color:var(--acc);white-space:nowrap}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.set{min-height:40px;min-width:52px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:800;background:var(--card2);color:var(--mute)}
.set[aria-pressed=true]{background:var(--carb);color:#0d1f18}
.link{color:var(--pro);font-weight:700;font-size:13px;min-height:36px;margin-top:4px}
.wcard{position:relative;overflow:hidden;border-radius:28px;padding:20px;margin-bottom:14px;background:var(--grad);color:#fff;box-shadow:var(--glow)}
.wcard svg{position:absolute;right:-6px;bottom:-10px;width:140px;height:140px;opacity:.95}
.wcard h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:22px;line-height:1.15;max-width:62%}
.wcard p{margin:6px 0 16px;max-width:60%;font-weight:600;opacity:.9}
.wcard .pill{display:inline-block;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:10px}
.wcard button{background:#fff;color:#1a1418;min-height:46px;padding:0 20px;border-radius:15px;font-weight:800;position:relative}
.prog{height:8px;border-radius:9px;background:rgba(0,0,0,.2);margin:0 0 14px;max-width:60%;overflow:hidden}.prog i{display:block;height:100%;background:#fff;border-radius:9px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:7;background:#fff;color:#16131a;border-radius:20px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:12px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer.on{display:flex}.timer span:nth-child(2){font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:18px;min-width:52px}
.timer button{background:#16131a;color:#fff;border-radius:14px;min-height:38px;padding:0 14px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:22px;padding:14px 12px;position:relative;overflow:hidden;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.st svg{position:absolute;top:6px;right:4px;width:48px;height:48px}
.st b{font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:22px;line-height:1.1}.st small{font-size:11px;color:var(--mute);font-weight:700;line-height:1.25}
.fig{position:relative;height:190px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;margin-top:14px}
.bars div{display:grid;gap:6px;justify-items:center;height:100%;align-content:end;font-size:11px;color:var(--mute);font-weight:700}
.bars i{width:100%;max-width:30px;border-radius:9px 9px 6px 6px;background:var(--card2);display:block}
.bars i.on{background:var(--grad)}.bars i.over{background:#ff3d5a}
.row{display:flex;align-items:center;gap:10px}
.list{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;width:100%;text-align:left;border-top:1px solid var(--line);font-weight:700}
.li:first-child{border-top:0}.li .v{color:var(--ink);font-weight:800;white-space:nowrap}.li .v::after{content:" ›";color:var(--mute)}
.li .ic{width:26px;text-align:center;font-size:18px}
.sec{font-size:12px;font-weight:800;color:var(--acc);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.06em}
.wbig{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2b2330,#221e27);border:1px solid rgba(255,107,44,.25)}
.wbig small{color:var(--mute);font-weight:700;font-size:13px}.wbig .big{font-size:44px}
.wbig button{background:var(--grad);color:#fff;min-height:46px;padding:0 18px;border-radius:15px;font-weight:800;box-shadow:var(--glow)}
.badge{position:absolute;top:-10px;right:18px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;transform:rotate(4deg)}
.prem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:22px;border:1.5px solid var(--acc);background:rgba(255,107,44,.08)}
.prem i{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-content:center;font-style:normal;font-size:20px;flex:none}
.prem small{display:block;color:var(--mute);font-size:12px;font-weight:700}
label{font-size:13px;color:var(--mute);display:block;margin:12px 0 6px;font-weight:700}
input,select{font:inherit;font-size:16px;width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-weight:700}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:18px;background:var(--card);font-weight:800;text-align:left;border:2px solid transparent}
.opt[aria-pressed=true]{border-color:var(--acc);background:rgba(255,107,44,.1)}.opt span{font-size:22px}
.opt small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.dots i{width:22px;height:5px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--acc)}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;background:var(--card);display:block}
.scan{height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%;animation:s 1s linear infinite;margin:14px 0}
@keyframes s{from{background-position:-50% 0}to{background-position:150% 0}}
.chat{display:flex;flex-direction:column;gap:8px;min-height:42vh;max-height:52vh;overflow:auto;padding:4px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:20px;font-size:15px;white-space:pre-line;font-weight:600}
.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--card);font-size:13px;font-weight:700}
.send{width:50px;height:50px;border-radius:16px;background:var(--grad);color:#fff;flex:none;font-size:18px}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;background:var(--card);border:2px solid transparent;margin-bottom:8px;min-height:64px;font-weight:800}
.plan[aria-pressed=true]{border-color:var(--acc)}.plan .price{font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:17px;white-space:nowrap}
.plan .sale{background:var(--grad);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
.freebox{border-radius:26px;padding:20px;background:var(--grad);margin-bottom:14px;position:relative;overflow:hidden}
.freebox svg{position:absolute;right:-4px;bottom:-8px;width:120px;height:120px}
.freebox h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-size:24px}.freebox p{margin:4px 0 0;font-weight:700;max-width:60%}
.feat{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px;font-weight:700;font-size:14px}
.feat li::before{content:"✓";color:var(--carb);margin-right:8px;font-weight:800}
.note{font-size:12px;color:var(--mute);text-align:center;margin:10px 0 0;font-weight:600}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-80px);background:#fff;color:#16131a;font-weight:800;padding:10px 18px;border-radius:16px;z-index:30;transition:transform .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.water{display:flex;gap:6px;margin-top:12px}.water button{flex:1;height:36px;border-radius:10px;background:var(--card2)}
.water button.f{background:linear-gradient(180deg,#7aa4ff,#4d7cff)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>

 'Подтягивания':'Начинай движение с лопаток, тянись грудью к перекладине, без раскачки. Не получается — используй резинку.'};

const dk=i=>{const k=key(addDays(today,i-wd(today)));return k};
const burned=k=>{const d=plan().days[wd(pk(k))];if(!d)return 0;return d.ex.reduce((a,e,i)=>a+((DONE[k+'#'+i]||[]).filter(Boolean).length),0)*35};

 if(d.edit)edit(d.edit);
